---
name: Build

on:
  workflow_call:
    secrets:
      SEGMENT_ANALYTICS_KEY:
        required: true
      LD_CLIENT_ID:
        required: true
      SENTRY_KEY:
        required: true

env:
  SEGMENT_ANALYTICS_KEY: ${{ secrets.SEGMENT_ANALYTICS_KEY }}
  LD_CLIENT_ID: ${{ secrets.LD_CLIENT_ID }}
  SENTRY_KEY: ${{ secrets.SENTRY_KEY }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build
        uses: ConsenSys/github-actions/docs-build@ec3b452d3471664332de10917cae9e6e19415eab # main
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
